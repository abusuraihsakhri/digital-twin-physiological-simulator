name: Deploy browser explorer to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static artifact
        run: |
          mkdir -p _site/web
          cp index.html _site/index.html
          cp web/index.html web/app.mjs web/rules.mjs _site/web/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Allow uploaded artifact metadata to propagate
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public site and static assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 5 "${PAGE_URL}" -o "${RUNNER_TEMP}/pages-root.html"
          curl -fsSL --retry 8 --retry-delay 5 "${PAGE_URL}web/" -o "${RUNNER_TEMP}/pages-app.html"
          curl -fsSL --retry 8 --retry-delay 5 "${PAGE_URL}web/app.mjs" -o "${RUNNER_TEMP}/pages-app.mjs"
          curl -fsSL --retry 8 --retry-delay 5 "${PAGE_URL}web/rules.mjs" -o "${RUNNER_TEMP}/pages-rules.mjs"
          grep -Fq "PhysioTwin" "${RUNNER_TEMP}/pages-root.html"
          grep -Fq "Parameter Rule Explorer" "${RUNNER_TEMP}/pages-app.html"
          grep -Fq "evaluateTask" "${RUNNER_TEMP}/pages-app.mjs"
          grep -Fq "LIMITS" "${RUNNER_TEMP}/pages-rules.mjs"
