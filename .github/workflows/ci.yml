name: Python and browser tests

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[api,test]'
          python -m pip check
      - name: Python test suite
        run: python -m pytest -q
      - name: Installed CLI smoke test
        run: digital-twin-physiological-simulator --help
      - name: JavaScript syntax and browser rule tests
        run: |
          node --check web/rules.mjs
          node --check web/app.mjs
          node --test web/rules.test.mjs
      - name: Static entry point checks
        run: |
          test -f index.html
          test -f web/index.html
          test -f web/app.mjs
          test -f web/rules.mjs
